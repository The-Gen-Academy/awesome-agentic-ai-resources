[project]
name = "langchain-langgraph-quickstart"
version = "0.1.0"
description = "A hands-on notebook introducing LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
dependencies = [
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "nbformat>=5.11.1",
]
